<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Danke! | Lisa Scheier – Google Ads Expertin</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root{--cream:#F7EDD8;--forest:#182E25;--forest-mid:#2E5443;--gold:#C9A84C;--gold-light:#E2C97E;--white:#FDFAF5;--text:#2E1A0E;--text-muted:#7A6050;--font-serif:'Cormorant Garamond',Georgia,serif;--font-sans:'Jost',system-ui,sans-serif}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--font-sans);background:linear-gradient(135deg,var(--forest) 0%,var(--forest-mid) 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem}
    .card{background:rgba(247,237,216,.06);border:1.5px solid rgba(201,168,76,.3);border-radius:16px;padding:4rem 3rem;max-width:560px;width:100%}
    .icon{font-size:3rem;margin-bottom:1.5rem}
    h1{font-family:var(--font-serif);font-size:clamp(2rem,5vw,3rem);font-weight:300;color:var(--cream);margin-bottom:1rem}
    p{font-size:1rem;color:#9BBCAD;line-height:1.8;margin-bottom:2rem}
    a{display:inline-block;padding:.9rem 2.25rem;background:var(--gold);color:var(--text);font-family:var(--font-sans);font-size:.9rem;font-weight:500;letter-spacing:.06em;border-radius:4px;text-decoration:none;transition:background .3s}
    a:hover{background:var(--gold-light)}
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✦</div>
    <h1>Danke für deine Nachricht!</h1>
    <p>Ich habe deine Anfrage erhalten und melde mich innerhalb von 24 Stunden bei dir — ich freue mich darauf, dich kennenzulernen.</p>
    <a href="index.html">Zurück zur Startseite</a>
  </div>
</body>
</html>
